<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DragOS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="boot-screen">
    <div class="boot-content">
      <div class="boot-logo">AdityaOS</div>
      <div class="boot-status">"If I am all there is, then what am I? If you are all there is, then what are you?"&hellip;</div>
      <div class="boot-bar">
        <div class="boot-bar-fill" id="boot-bar-fill"></div>
      </div>
      <div class="boot-percent" id="boot-percent">0%</div>
    </div>
  </div>
  <div id="desktop" hidden>
    <div class="desktop-icons" id="desktop-icons">
      <button class="desktop-icon" data-app="about">
        <span class="desktop-icon-glyph">👤</span>
        <span class="desktop-icon-label">About</span>
      </button>
      <button class="desktop-icon" data-app="notepad">
        <span class="desktop-icon-glyph">📓</span>
        <span class="desktop-icon-label">Notepad</span>
      </button>
      <button class="desktop-icon" data-app="snake">
        <span class="desktop-icon-glyph">🐍</span>
        <span class="desktop-icon-label">Snake</span>
      </button>
      <button class="desktop-icon" data-app="tictactoe">
        <span class="desktop-icon-glyph">🃏</span>
        <span class="desktop-icon-label">Ox game</span>
      </button>
    </div>
    <div id="window-layer"></div>
    <div id="taskbar">
      <button id="start-button">
        <span class="start-glyph">🪟</span>
        <span>Start</span>
      </button>
      <div id="taskbar-items"></div>
      <div id="tray">
        <span id="tray-indicators">🔊 🌐 🔋</span>
        <span id="clock">--:--</span>
      </div>
    </div>
    <div id="start-menu" hidden>
      <div class="start-menu-header">
        <span class="start-menu-title">AdityaOS</span>
      </div>
      <input id="start-search" type="text" placeholder="Search apps">
      <div class="start-menu-section-label">Applications</div>
      <div class="start-menu-apps" id="start-menu-apps">
        <button class="start-menu-app" data-app="about">
          <span class="start-menu-app-glyph">👤</span>About
        </button>
        <button class="start-menu-app" data-app="notepad">
          <span class="start-menu-app-glyph">📓</span> Notepad
        </button>
        <button class="start-menu-app" data-app="snake">
          <span class="start-menu-app-glyph">🐍</span> Serpant game
        </button>
        <button class="start-menu-app" data-app="tictactoe">
          <span class="start-menu-app-glyph">🃏</span>OX game
        </button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
